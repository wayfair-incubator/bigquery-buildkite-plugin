name: "BigQuery Buildkite Plugin"
description: "Deploy BigQuery table/view schemas and SQL scripts using Python 3.14 and the gbq library"
author: "Jash Parekh <jash389@gmail.com>"
requirements:
  - bash
  - docker
  - git
configuration:
  properties:
    gcp_project:
      type: string
      description: "GCP project ID where BigQuery resources will be deployed"
    dataset_schema_directory:
      type: string
      description: "Directory path containing schema files (JSON for tables/views, SQL for queries)"
    prod_build_branch:
      type: string
      description: "Production branch name for determining deployment strategy (default: master)"
    execute_only_changed_files:
      type: boolean
      description: "Only deploy schema files changed in the build: the last commit on prod_build_branch, or the whole branch compared with prod_build_branch otherwise (default: false)"
    fail_pipeline_on_first_exception:
      type: boolean
      description: "Stop deployment immediately on first error (default: true)"
    custom_image:
      type: string
      description: "Custom Docker image to use for deployment (default: python:3.15-slim)"
    mode:
      type: string
      enum: ["apply", "plan", "validate"]
      description: "apply deploys (default); plan shows what would change without changing anything; validate checks the definition files offline, without credentials"
    include:
      type: array
      items:
        type: string
      description: "Only deploy files matching one of these globs, relative to dataset_schema_directory (default: all files)"
    exclude:
      type: array
      items:
        type: string
      description: "Skip files matching any of these globs, relative to dataset_schema_directory (default: none)"
    annotate:
      type: boolean
      description: "Add a Buildkite annotation summarising each file's result (default: false)"
    annotation_context:
      type: string
      description: "Context of the annotation, so several deployments can each keep their own (default: bigquery)"
    debug_mode:
      type: boolean
      description: "Enable verbose debug logging for troubleshooting (default: false)"
  required:
    - gcp_project
    - dataset_schema_directory
  additionalProperties: false
